[package]
name = "agenda"
version.workspace = true
edition.workspace = true
description = "Agenda: Selfkit tasks app"

[lib]
name = "agenda_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Test builds: built-in public sync key, so no passphrase prompts while testing.
# Turn off (cargo --no-default-features) for builds that hold real data.
default = ["sync-test-key"]
sync-test-key = ["selfkit-appsync/test-key"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
selfkit-core = { path = "../../../selfkit-core", default-features = false }
# Shared app-side sync (LAN to the PC agent, else Postgres/S3); commands for ui/src/sync.
selfkit-appsync = { path = "../../../selfkit-appsync", features = ["tauri"] }
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
tauri-plugin-notification = "2"
time = "0.3"
tauri-plugin-opener = "2"
base64 = "0.22"
sha2 = "0.10"
dirs = "6"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "android")'.dependencies]
selfkit-appsync = { path = "../../../selfkit-appsync", features = ["tauri", "android"] }
