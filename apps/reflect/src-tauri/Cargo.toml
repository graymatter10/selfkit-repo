[package]
name = "reflect"
version.workspace = true
edition.workspace = true
description = "Reflect: Selfkit stats across Chrono, Hisab, Agenda and Dusk"

[lib]
name = "reflect_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Test builds: built-in public sync key, so no passphrase prompts while testing.
# Turn off (cargo --no-default-features) for builds that hold real data.
default = ["sync-test-key", "lock-test"]
sync-test-key = ["selfkit-appsync/test-key"]
# Test builds: the app-lock screen opens by itself after a few seconds (docs/components/app-lock.md).
lock-test = ["selfkit-appsync/lock-test"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
selfkit-core = { path = "../../../selfkit-core", default-features = false }
# Shared app-side sync (LAN to the PC agent, else Postgres/S3); commands for ui/src/sync.
selfkit-appsync = { path = "../../../selfkit-appsync", features = ["tauri"] }
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
rusqlite = "0.37"

[target.'cfg(target_os = "android")'.dependencies]
selfkit-appsync = { path = "../../../selfkit-appsync", features = ["tauri", "android"] }
