# Linux packages for every app (.deb + AppImage) and the agent (.deb + tarball), built in
# the cloud on Ubuntu 22.04 (older glibc = AppImages that run on more distros), tested
# (install, start under Xvfb, remove keeps data) and uploaded.
# Run by hand, from test/** branches, or from release.yml. Local: installer/linux/build-local.sh.
# Docs: docs/platforms/linux.md, docs/release.md.
name: linux
on:
  push:
    branches: ["test/**"]
  workflow_dispatch:
    inputs:
      test: { description: "Run the package tests", type: boolean, default: true }
  workflow_call:
    inputs:
      test: { type: boolean, default: true }
concurrency:
  group: linux-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_BUILD_JOBS: "4"
jobs:
  bundles:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Free disk space
        # The runner has ~20 GB free; 5 apps + every crate in one target dir ran out
        # (ld "Bus error", signal 7). Drop preinstalled toolchains this job does not use.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/lib/android
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libx11-dev libxss-dev libdbus-1-dev patchelf file xvfb dbus
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: linux-bundle, cache-on-failure: true }
      - run: bun install
      - name: Agent release build + packages
        run: |
          cargo build --release -p selfkit-agent
          ver=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)
          installer/linux/build-agent-packages.sh target/release/selfkit-agent "$ver" dist
      - name: App bundles (.deb + AppImage)
        run: |
          mkdir -p dist; failed=""
          for d in apps/*/; do
            [ -f "$d/src-tauri/tauri.conf.json" ] || continue
            if (cd "$d" && bun tauri build --bundles deb,appimage); then
              # Copy right away: Tauri empties bundle/appimage at the start of every
              # AppImage build, so only the last app's AppImage used to survive.
              cp target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage dist/
            else
              failed="$failed $d"
            fi
          done
          ls -la dist
          [ -z "$failed" ] || { echo "::error::bundle failed for:$failed"; exit 1; }
      - name: Test packages (install, start, remove keeps data)
        if: ${{ github.event_name == 'push' || inputs.test }}
        run: installer/linux/test-packages.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.tar.gz
          retention-days: 14
