# Rust tests for every crate and a frontend build for every app.
name: ci
on:
  push:
    branches: [master, "test/**"]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_BUILD_JOBS: "4"
  # Smaller test artifacts (no full debug info): keeps the target dir within the runner's disk.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: selfkit, POSTGRES_USER: selfkit, POSTGRES_DB: selfkit }
        ports: ["55432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    steps:
      - name: Free disk space
        # The runner has ~20 GB free; 5 apps + every crate in one target dir ran out
        # (ld "Bus error", signal 7). Drop preinstalled toolchains this job does not use.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/lib/android
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libx11-dev libxss-dev xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: linux, cache-on-failure: true }
      - run: bun install
      - name: Frontend builds
        run: for d in apps/*/; do [ -f "$d/package.json" ] && (cd "$d" && bun run build) || true; done
      - name: Browser extension tests
        run: bun test extension/test
      - name: Rust tests
        run: cargo test --workspace -j 4 --no-fail-fast
