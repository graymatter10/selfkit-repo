# Windows: build and test the agent and every app on a real Windows runner,
# and produce NSIS installers. Run by hand or from test/** branches.
name: windows
on:
  push:
    branches: ["test/**"]
  workflow_dispatch:
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_BUILD_JOBS: "4"
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: windows, cache-on-failure: true }
      - run: bun install
      - name: Rust tests (agent + core)
        run: cargo test -p selfkit-core -p selfkit-agent
      - name: Agent release build
        run: cargo build --release -p selfkit-agent
      - name: App installers
        shell: bash
        run: |
          for d in apps/*/; do
            [ -f "$d/src-tauri/tauri.conf.json" ] || continue
            (cd "$d" && bun tauri build --bundles nsis) || echo "::warning::bundle failed for $d"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            target/release/selfkit-agent.exe
            target/release/bundle/nsis/*.exe
          retention-days: 7
