[package]
name = "selfkit-appsync"
version.workspace = true
edition.workspace = true
description = "App-side sync for Selfkit apps: one sync pass (LAN to a desktop agent, else Postgres+S3), status, settings, conflicts, scheduler hook."

[features]
default = []
# Built-in test key: test builds unlock without a passphrase. NEVER in release builds for real data.
test-key = []
# App lock in test builds: the lock screen opens by itself after a few seconds unless
# someone types, so automated phone tests never get stuck. Ignored when SELFKIT_RELEASE=1.
lock-test = []
# JNI entry points for the Kotlin plugin (android-plugins/selfkit-sync).
android = ["dep:jni"]
# Shared Tauri commands (sync_status, sync_now, ...) for the apps.
tauri = ["dep:tauri"]

[dependencies]
selfkit-core = { path = "../selfkit-core", default-features = false, features = ["remote", "lan"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
base64 = "0.22"
sha2 = "0.10"
jni = { version = "0.21", optional = true, default-features = false }
tauri = { version = "2", optional = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
selfkit-core = { path = "../selfkit-core", default-features = false, features = ["remote", "lan", "keychain"] }

[dev-dependencies]
tempfile = "3"
tokio-postgres = "0.7"
uuid.workspace = true
